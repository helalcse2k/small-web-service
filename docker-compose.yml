services:
  app:
    build:
      context: ./app
      dockerfile: ../Dockerfile
    image: devops-task-service:local
    container_name: devops-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "${PORT:-8080}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      ENV_NAME: "${ENV_NAME:-local}"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks:
      - internal

networks:
  internal:
    driver: bridge
