apiVersion: v1
kind: Namespace
metadata:
  name: devops-task
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-task-config
  namespace: devops-task
data:
  PORT: "8080"
  LOG_LEVEL: "info"
  ENV_NAME: "kubernetes"
  APP_VERSION: "1.0.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: devops-task-secret
  namespace: devops-task
type: Opaque
# IMPORTANT: Do NOT commit real secrets. Use external-secrets or sealed-secrets.
# Example placeholder (base64-encoded "changeme"):
stringData:
  secret-key: "changeme"
---
apiVersion: v1
kind: Service
metadata:
  name: devops-task
  namespace: devops-task
  labels:
    app: devops-task
spec:
  selector:
    app: devops-task
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-task
  namespace: devops-task
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: devops-task.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-task
                port:
                  name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-task-hpa
  namespace: devops-task
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-task
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
